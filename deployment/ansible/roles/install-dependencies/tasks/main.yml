---
# Role: install-dependencies
# Installs required packages and dependencies

- name: Install required packages (Debian)
  apt:
    name:
      - curl
      - wget
      - git
      - docker.io
      - docker-compose
      - python3-pip
      - supervisor
      - jq
    state: present
  when: ansible_os_family == "Debian"

- name: Install required packages (RedHat)
  yum:
    name:
      - curl
      - wget
      - git
      - docker
      - docker-compose
      - python3-pip
      - supervisor
      - jq
    state: present
  when: ansible_os_family == "RedHat"

- name: Install Go (if not already installed)
  block:
    - name: Check if Go is installed
      stat:
        path: /usr/local/go/bin/go
      register: go_installed

    - name: Download Go
      get_url:
        url: https://go.dev/dl/go1.21.linux-amd64.tar.gz
        dest: /tmp/go.tar.gz
      when: not go_installed.stat.exists

    - name: Extract Go
      unarchive:
        src: /tmp/go.tar.gz
        dest: /usr/local
        remote_src: yes
      when: not go_installed.stat.exists

    - name: Set Go environment
      lineinfile:
        path: /etc/profile.d/go.sh
        line: "export PATH=$PATH:/usr/local/go/bin"
        create: yes

- name: Start Docker service
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Install Python dependencies
  pip:
    name:
      - ansible
      - requests
      - jinja2
    state: present
