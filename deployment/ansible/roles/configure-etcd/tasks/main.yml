---
# Role: configure-etcd
# Configures etcd for metadata coordination

- name: Check if etcd is running
  uri:
    url: "http://localhost:2379/version"
    method: GET
    status_code: 200
  register: etcd_check
  failed_when: false
  changed_when: false

- name: Install etcd
  block:
    - name: Download etcd
      get_url:
        url: https://github.com/etcd-io/etcd/releases/download/v3.5.10/etcd-v3.5.10-linux-amd64.tar.gz
        dest: /tmp/etcd.tar.gz

    - name: Extract etcd
      unarchive:
        src: /tmp/etcd.tar.gz
        dest: /opt
        remote_src: yes

    - name: Create etcd data directory
      file:
        path: /var/lib/etcd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create etcd systemd service
      copy:
        content: |
          [Unit]
          Description=etcd key-value store
          After=network.target
          
          [Service]
          Type=notify
          ExecStart=/opt/etcd-v3.5.10-linux-amd64/etcd \
            --name=etcd \
            --data-dir=/var/lib/etcd \
            --listen-client-urls=http://0.0.0.0:2379 \
            --advertise-client-urls=http://{{ ansible_default_ipv4.address }}:2379
          Restart=on-failure
          RestartSec=5s
          
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/etcd.service
      notify:
        - Reload systemd
        - Start etcd

  when: etcd_check.failed

- name: Ensure etcd is running
  systemd:
    name: etcd
    state: started
    enabled: yes
