---
# Main Ansible playbook for deploying MessageBroker cluster

- name: Deploy MessageBroker cluster
  hosts: all
  become: yes
  vars:
    messagebroker_version: "1.0.0"
    messagebroker_user: "messagebroker"
    messagebroker_group: "messagebroker"
    messagebroker_home: "/opt/messagebroker"
    messagebroker_data_dir: "/var/lib/messagebroker"
    messagebroker_log_dir: "/var/log/messagebroker"
    messagebroker_config_dir: "/etc/messagebroker"
    docker_registry: "docker.io"
    docker_image: "messagebroker"
    etcd_servers: "localhost:2379"
    replication_factor: 3
    min_isr: 2

  pre_tasks:
    - name: Update system packages
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Update system packages (RedHat)
      yum:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

  roles:
    - install-dependencies
    - configure-broker
    - deploy-broker
    - configure-etcd
    - health-check

  post_tasks:
    - name: Display cluster status
      debug:
        msg: "MessageBroker cluster deployed successfully"

    - name: Print broker endpoints
      debug:
        msg: "Broker endpoints: {% for item in groups['messagebroker'] %}{{ hostvars[item]['ansible_default_ipv4']['address'] }}:9092{% if not loop.last %},{% endif %}{% endfor %}"
