# Multi-broker compose file for local development

version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.10
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ETCD_NAME=etcd
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_INITIAL_CLUSTER=etcd=http://etcd:2380

  broker1:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    ports:
      - "9092:9092"
    environment:
      - BROKER_ID=1
      - BROKER_HOST=broker1
      - BROKER_PORT=9092
      - COORDINATOR_URL=etcd:2379
      - DATA_DIR=/app/data
    volumes:
      - broker1_data:/app/data
    depends_on:
      - etcd
    networks:
      - messagebroker_net

  broker2:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    ports:
      - "9093:9092"
    environment:
      - BROKER_ID=2
      - BROKER_HOST=broker2
      - BROKER_PORT=9092
      - COORDINATOR_URL=etcd:2379
      - DATA_DIR=/app/data
    volumes:
      - broker2_data:/app/data
    depends_on:
      - etcd
    networks:
      - messagebroker_net

  broker3:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    ports:
      - "9094:9092"
    environment:
      - BROKER_ID=3
      - BROKER_HOST=broker3
      - BROKER_PORT=9092
      - COORDINATOR_URL=etcd:2379
      - DATA_DIR=/app/data
    volumes:
      - broker3_data:/app/data
    depends_on:
      - etcd
    networks:
      - messagebroker_net

volumes:
  broker1_data:
  broker2_data:
  broker3_data:

networks:
  messagebroker_net:
    driver: bridge
